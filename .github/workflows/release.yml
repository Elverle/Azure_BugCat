name: Release

on:
  push:
    tags: ['v*']

jobs:
  package:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # `npm run package` passes --publish never. Left implicit, electron-builder
      # sees the git tag under CI, switches itself into publish mode, and then
      # fails for want of GH_TOKEN — after the installer is already built.
      # Publishing is the release job's business, through `gh release create`.
      - name: Package
        run: npm run package
        env:
          # There is no Apple Developer certificate for v1: without this,
          # electron-builder looks for a signing identity, finds none, and fails
          # the job instead of producing an unsigned dmg. The README says plainly
          # that the builds are unsigned.
          CSC_IDENTITY_AUTO_DISCOVERY: false

      - uses: actions/upload-artifact@v4
        with:
          name: installers-${{ matrix.os }}
          path: |
            dist-electron/*.exe
            dist-electron/*.dmg
          if-no-files-found: error

  release:
    needs: package
    runs-on: ubuntu-latest
    # Creating the release writes to the repository: the read-only default is
    # not enough, and this is the only job that needs more.
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      # A draft, on purpose: the installers are unsigned and untested until
      # someone downloads one. Task 13 verifies, then a human publishes.
      - name: Create the draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ github.ref_name }}" \
            --repo "${{ github.repository }}" \
            --title "${{ github.ref_name }}" \
            --draft \
            --generate-notes \
            artifacts/*
