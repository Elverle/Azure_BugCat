name: CI

on:
  push:
    branches: [main]
  pull_request:

# The default token only needs to read the code: nothing here writes back.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      # The build is part of the gate by a standing decision from phase 1: it
      # stayed broken for three tasks when only lint and tests were checked.
      - name: Build
        run: npm run build
